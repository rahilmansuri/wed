<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jashne Shadi Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f6f5; --card:#fff; --ink:#1d2321; --muted:#5f6b67; --line:#d5dcd9; --accent:#2f5d50; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans Gujarati", system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:24px; grid-template-columns:1fr; }
  @media (min-width:820px) { main { grid-template-columns:320px 1fr; align-items:start; } }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .btns { display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; }
  button { flex:1; padding:12px; font:inherit; font-weight:700; border-radius:8px; border:1px solid var(--accent); cursor:pointer; background:var(--accent); color:#fff; }
  button.alt { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  #status { font-size:13px; color:var(--muted); margin-top:12px; min-height:1em; }
  .preview { display:grid; gap:16px; }
  .preview canvas { width:100%; height:auto; display:block; border-radius:6px; box-shadow:0 2px 12px rgba(0,0,0,.12); }
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>જશ્ને શાદી</h1>
    <p class="sub">મહેમાનનું નામ લખો અને કંકોત્રી PDF ડાઉનલોડ કરો.</p>
    <label for="l1">જનાબ, (નામ)</label>
    <input id="l1" autocomplete="off" placeholder="દા.ત. મનસુરી રાહિલ હાજી ઈલિયાસએહમદ">
    <label for="l2">લાઇન ૨ (વૈકલ્પિક)</label>
    <input id="l2" autocomplete="off" placeholder="સહકુટુંબ / સરનામું">
    <label for="l3">લાઇન ૩ (વૈકલ્પિક)</label>
    <input id="l3" autocomplete="off" placeholder="શહેર">
    <div class="btns">
      <button id="download" disabled>Download PDF</button>
      <button id="share" class="alt" disabled hidden>Share</button>
    </div>
    <div id="status">Loading…</div>
  </section>
  <section class="preview"><canvas id="preview0"></canvas><canvas id="preview1"></canvas></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const PDF_URL = 'invitation.pdf';
// Preview images and size (PDF points) of each page that gets text.
const PAGES = [
  { src: 'page1.jpg', w: 663.307, h: 666.142 },
  { src: 'page2.jpg', w: 634.961, h: 637.795 },
];
// Where each input is written: page index, input index, left x, width, and the line's y
// (all in points from the top-left). Text sits just above the line.
const SLOTS = [
  { page: 0, input: 0, x: 217, w: 271, y: 373, size: 15 },
  { page: 0, input: 1, x: 217, w: 271, y: 407, size: 15 },
  { page: 0, input: 2, x: 217, w: 271, y: 441, size: 15 },
  { page: 1, input: 0, x: 141, w: 330, y: 210, size: 13 }, // મોહતરમ જનાબ ........
];
const FONT = '"Noto Sans Gujarati"';
const GAP = 4, SCALE = 4;

const $ = id => document.getElementById(id);
const inputs = [$('l1'), $('l2'), $('l3')];
let pdfBytes;

// Text is drawn on a canvas so the browser shapes Gujarati correctly, then embedded as an image.
function textCanvas(text, slot) {
  const h = slot.size * 1.8;
  const c = document.createElement('canvas');
  c.width = slot.w * SCALE; c.height = h * SCALE;
  const ctx = c.getContext('2d');
  ctx.scale(SCALE, SCALE);
  let size = slot.size;
  ctx.font = `700 ${size}px ${FONT}`;
  while (ctx.measureText(text).width > slot.w - 8 && size > 7) ctx.font = `700 ${--size}px ${FONT}`;
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, slot.w / 2, h - GAP);
  return c;
}

function values() { return inputs.map(i => i.value.trim()); }

function filledSlots() {
  const v = values();
  return SLOTS.filter(s => v[s.input]).map(s => ({ ...s, canvas: textCanvas(v[s.input], s) }));
}

function drawPreview() {
  const r = 2, slots = filledSlots();
  PAGES.forEach((p, i) => {
    const c = $('preview' + i);
    c.width = p.w * r; c.height = p.h * r;
    const ctx = c.getContext('2d');
    ctx.drawImage(p.img, 0, 0, c.width, c.height);
    for (const s of slots.filter(s => s.page === i)) {
      const h = s.canvas.height / SCALE;
      ctx.drawImage(s.canvas, s.x * r, (s.y - h) * r, s.w * r, h * r);
    }
  });
}

async function buildPdf() {
  const doc = await PDFLib.PDFDocument.load(pdfBytes);
  for (const s of filledSlots()) {
    const page = doc.getPage(s.page);
    const png = await doc.embedPng(s.canvas.toDataURL('image/png'));
    const h = s.canvas.height / SCALE;
    page.drawImage(png, { x: s.x, y: page.getSize().height - s.y, width: s.w, height: h });
  }
  return doc.save();
}

function fileName() {
  const n = values()[0].replace(/[\\/:*?"<>|]+/g, '').trim();
  return `Jashne-Shadi${n ? ' - ' + n : ''}.pdf`;
}

async function withBusy(fn) {
  const btns = [$('download'), $('share')];
  btns.forEach(b => b.disabled = true);
  $('status').textContent = 'Preparing PDF…';
  try { await fn(); $('status').textContent = 'Done.'; }
  catch (e) { if (e.name !== 'AbortError') { console.error(e); $('status').textContent = 'Error: ' + e.message; } else $('status').textContent = ''; }
  finally { btns.forEach(b => b.disabled = false); }
}

$('download').onclick = () => withBusy(async () => {
  const blob = new Blob([await buildPdf()], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
});

$('share').onclick = () => withBusy(async () => {
  const file = new File([await buildPdf()], fileName(), { type: 'application/pdf' });
  await navigator.share({ files: [file], title: 'જશ્ને શાદી' });
});

inputs.forEach(i => i.addEventListener('input', drawPreview));

const params = new URLSearchParams(location.search);
['name', 'l2', 'l3'].forEach((k, i) => { if (params.get(k)) inputs[i].value = params.get(k); });

(async () => {
  try {
    await document.fonts.load(`700 15px ${FONT}`, 'જનાબ');
    await Promise.all(PAGES.map(p => { p.img = new Image(); p.img.src = p.src; return p.img.decode(); }));
    drawPreview();
    $('status').textContent = 'Loading invitation…';
    pdfBytes = await (await fetch(PDF_URL)).arrayBuffer();
    $('download').disabled = false;
    const probe = new File([''], 'x.pdf', { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [probe] })) { $('share').hidden = false; $('share').disabled = false; }
    $('status').textContent = '';
  } catch (e) {
    console.error(e);
    $('status').textContent = 'Could not load invitation.pdf (' + e.message + ')';
  }
})();
</script>
</body>
</html>
